[project]
name = "music-store-support-agent"
version = "0.1.0"
description = "Tom, a customer support agent for a musical instrument store"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
