[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools finds data/ next to emporio/ and refuses to guess
# which one is the package, so `pip install -e .` fails on a clean clone.
[tool.setuptools]
packages = ["emporio"]

[project]
name = "music-store-support-agent"
version = "0.1.0"
description = "Tom, a customer support agent for a musical instrument store"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
